spring.application.name=TaskService

# JWT
jwt.secret=dGVzdGluZyB0aGUgYXBwIG5vdyB3aXRoIGJhc2UgNjQgZW5jb2RlZCBwYXNzd29yZCA=

# Logging format (shared)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.file-name-pattern=logs/application-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=30

# File storage defaults (override per env if needed)
file.storage.local.path=uploads
attachments.storage.local-path=uploads/attachments/
attachments.storage.tasks-path=uploads/attachments/tasks/
attachments.storage.comments-path=uploads/attachments/comments/
attachments.storage.subtasks-path=uploads/attachments/subtasks/

# Kafka producer (shared settings)
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.task-created=task-created
app.kafka.topic.task-updated=task-updated
