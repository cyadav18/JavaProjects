server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}/login_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

logging:
  level:
    org.springframework: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.guidewire.login: TRACE

  file:
    name: logs/login-service.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/login-service-%d{yyyy-MM-dd}.log
      max-history: 30
