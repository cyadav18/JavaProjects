server:
  port: 80

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:prod-db-host}:${DB_PORT:5432}/login_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: OFF
    org.guidewire.login: INFO

  file:
    name: /var/log/login-service/login-service.log
  logback:
    rollingpolicy:
      file-name-pattern: /var/log/login-service/login-service-%d{yyyy-MM-dd}.log
      max-history: 30
