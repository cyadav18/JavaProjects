server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: login-service
          uri: http://login-service:8081
          predicates:
            - Path=/api/auth/**
        - id: task-service
          uri: http://task-service:8082
          predicates:
            - Path=/api/task-manager/**
        - id: notification-service
          uri: http://notification-service:8083
          predicates:
            - Path=/api/notifications/**
